name: gerar-keystore
on: workflow_dispatch
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar
        run: |
          keytool -genkeypair -v -keystore altus.keystore -alias altus \
            -keyalg RSA -keysize 4096 -validity 10000 -storetype PKCS12 \
            -dname "CN=ORION, O=ORION, L=Luanda, C=AO" \
            -storepass "200331" -keypass "200331"
      - name: Mostrar DN
        run: keytool -list -v -keystore altus.keystore -storepass "200331"
      - name: Base64
        run: base64 -w0 altus.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: altus.keystore
