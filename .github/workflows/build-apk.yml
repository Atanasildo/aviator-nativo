name: Build VooMatrix APK
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Instalar Gradle e gerar wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Restaurar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/altus.keystore
          echo "Keystore restaurada"

      - name: Compilar e Assinar APK (Release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/altus.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Obter versão e localizar APK
        id: apk
        run: |
          VERSAO=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          APK_NAME="VooMatrix-v${VERSAO}.apk"
          test -n "$APK_PATH"
          cp "$APK_PATH" "/tmp/${APK_NAME}"
          echo "versao=$VERSAO" >> $GITHUB_OUTPUT
          echo "path=/tmp/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "APK gerado: /tmp/${APK_NAME}"

      - name: Upload APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VooMatrix-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Upload APK para Supabase Storage
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.apk.outputs.path }}"
          APK_NAME="${{ steps.apk.outputs.name }}"
          HTTP_CODE=$(curl -sS -o /tmp/storage_resp.txt -w "%{http_code}" -X POST \
            "${SUPA_URL}/storage/v1/object/apks/${APK_NAME}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_PATH}")
          echo "Supabase Storage upload HTTP: $HTTP_CODE"
          cat /tmp/storage_resp.txt
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Falha ao enviar APK para Supabase Storage"
            exit 1
          fi
          echo "APK enviado: ${APK_NAME}"

      - name: Publicar Release com gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSAO="${{ steps.apk.outputs.versao }}"
          APK_PATH="${{ steps.apk.outputs.path }}"
          gh release delete "latest-build" --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create "latest-build" \
            "$APK_PATH" \
            --title "VooMatrix v${VERSAO}" \
            --notes "VooMatrix versão ${VERSAO}\nCommit: ${{ github.event.head_commit.message }}\nAPK assinado." \
            --latest
          echo "Release VooMatrix v${VERSAO} publicado"

      - name: Actualizar versão no Supabase (obrigatório)
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOTAS_RAW: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          VERSAO="${{ steps.apk.outputs.versao }}"
          APK_NAME="${{ steps.apk.outputs.name }}"
          APK_URL="${SUPA_URL}/storage/v1/object/public/apks/${APK_NAME}"
          PAYLOAD=$(jq -n \
            --arg versao "$VERSAO" \
            --arg url_apk "$APK_URL" \
            --arg notas "$NOTAS_RAW" \
            --arg bot "orion" \
            '{versao:$versao, url_apk:$url_apk, notas:$notas, bot:$bot}')
          HTTP_CODE=$(curl -sS -o /tmp/supa_resp.txt -w "%{http_code}" -X POST \
            "${SUPA_URL}/rest/v1/versao?on_conflict=bot" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "$PAYLOAD")
          echo "Supabase UPSERT HTTP: $HTTP_CODE"
          cat /tmp/supa_resp.txt
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "Falha ao actualizar public.versao"
            exit 1
          fi
          echo "Supabase actualizado: VooMatrix v${VERSAO} — ${APK_URL}"
