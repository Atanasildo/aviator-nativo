services:
  - type: web
    name: nexus-aviator-collector
    env: docker
    plan: free
    rootDir: collector
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: DISPLAY
        value: :99
      - key: EB_PHONE
        sync: false
      - key: EB_PASSWORD
        sync: false
      - key: EB_COOKIES
        sync: false
      - key: SUPA_URL
        value: https://ypzoqppctcsolsmuntvg.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
