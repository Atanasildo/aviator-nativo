plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def supabasePublishableKey = (project.findProperty("SUPABASE_PUBLISHABLE_KEY") ?: System.getenv("SUPABASE_PUBLISHABLE_KEY") ?: "").toString()

android {
    namespace 'ao.elephantbet.aviatorbot'
    compileSdk 34

    defaultConfig {
        applicationId "ao.elephantbet.aviatorbot"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "2.5"
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${supabasePublishableKey}\""
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "altus.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            android.applicationVariants.all { variant ->
                variant.outputs.all { outputFileName = "ORION-v${versionName}.apk" }
            }
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
            android.applicationVariants.all { variant ->
                variant.outputs.all { outputFileName = "ALTUS-v${versionName}.apk" }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += "/META-INF/{AL2.1,LGPL2.2}" } }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
